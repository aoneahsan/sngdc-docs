# ──────────────────────────────────────────────────────────────────────────
# SNGDC Docs — GitHub Pages deploy (MANUAL trigger only).
#
# Per the owner's standing policy, no workflow runs automatically on push.
# This deploys the Docusaurus site to GitHub Pages ONLY when you click
# "Run workflow" (workflow_dispatch). It is the second of the two configured
# hosts (the first is Firebase Hosting — see firebase.json / DEPLOY.md).
#
# One-time setup before the first run (USER-ONLY):
#   1. Repo Settings → Pages → Build and deployment → Source = "GitHub Actions".
#   2. (Custom domain) keep static/CNAME = docs.sndgc.aoneahsan.com, OR remove it
#      to serve at https://aoneahsan.github.io/sngdc-docs (then set baseUrl
#      to "/sngdc-docs/" in docusaurus.config.ts).
#   3. Pick ONE host for the custom domain — Firebase OR Pages — and point DNS
#      there. They are alternatives for the same domain, not simultaneous.
# ──────────────────────────────────────────────────────────────────────────

name: Deploy docs to GitHub Pages

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack (Yarn)
        run: corepack enable
      - name: Install dependencies
        run: yarn install --frozen-lockfile || yarn install
      - name: Build Docusaurus
        run: yarn build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
